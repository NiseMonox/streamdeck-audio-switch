<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>音频切换</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #2d2d2d; color: #d8d8d8; font: 9pt "Segoe UI", "Microsoft YaHei UI", sans-serif; user-select: none; }
  body { padding: 6px 12px 12px 0; }
  .item { display: flex; align-items: center; min-height: 30px; margin: 2px 0; }
  .item > label { flex: none; width: 94px; padding-right: 12px; box-sizing: border-box; text-align: right; color: #969696; }
  select { flex: 1; min-width: 0; height: 26px; padding: 0 4px; border: 0; border-radius: 3px; background: #3d3d3d; color: #d8d8d8; font: inherit; outline: none; }
  select:focus-visible { box-shadow: inset 0 0 0 1px #5a8fff; }
  select.missing { color: #e0a44c; }
  .note { margin: 10px 0 0 94px; color: #8a8a8a; line-height: 1.7; }
</style>
</head>
<body>
  <div id="items"></div>
  <div class="note" id="note"></div>

<script>
'use strict';

// The toggle key picks two devices; the headphones and speakers keys pick one each.
const LAYOUTS = {
  'com.nisemonox.audioswitch.toggle': {
    slots: [['A', '耳机'], ['B', '音箱']],
    note: '短按：在这两个设备之间切换<br>长按：打开“声音”设置<br>按键图标显示当前正在使用的设备'
  },
  device: {
    slots: [['', '设备']],
    note: '按下：切换到这个设备<br>长按：打开“声音”设置<br>这个设备正在使用时按键会亮起'
  }
};

const selects = {};
let socket = null, context = '', action = '', settings = {}, devices = null;

// Stream Deck calls this after the page has loaded.
function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
  context = uuid;
  const actionData = JSON.parse(actionInfo);
  action = actionData.action;
  settings = (actionData.payload && actionData.payload.settings) || {};
  build(LAYOUTS[action] || LAYOUTS.device);
  render();

  socket = new WebSocket('ws://127.0.0.1:' + port);
  socket.onopen = () => {
    send({ event: registerEvent, uuid });
    send({ event: 'sendToPlugin', action, context, payload: { command: 'getDevices' } });
  };
  socket.onmessage = (e) => {
    const message = JSON.parse(e.data);
    if (message.event === 'sendToPropertyInspector' && message.payload && message.payload.type === 'devices') {
      devices = message.payload.devices;
      render();
    } else if (message.event === 'didReceiveSettings') {
      settings = (message.payload && message.payload.settings) || {};
      render();
    }
  };
}

function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
}

function build(layout) {
  const items = document.getElementById('items');
  for (const [slot, label] of layout.slots) {
    const item = document.createElement('div');
    item.className = 'item';
    const caption = document.createElement('label');
    caption.htmlFor = 'device' + slot;
    caption.textContent = label;
    const select = document.createElement('select');
    select.id = 'device' + slot;
    select.addEventListener('change', () => choose(slot));
    item.append(caption, select);
    items.append(item);
    selects[slot] = select;
  }
  document.getElementById('note').innerHTML = layout.note;
}

function render() {
  const list = devices || [];
  for (const slot of Object.keys(selects)) {
    const select = selects[slot];
    const savedId = settings['device' + slot] || '';
    const savedName = settings['device' + slot + 'Name'] || '';
    // Same lookup as the plugin: by id, then by name.
    const match = list.find(d => d.id === savedId) || (savedName && list.find(d => d.name === savedName));

    select.textContent = '';
    select.add(new Option(devices ? '请选择设备…' : '正在读取设备…', ''));
    for (const d of list) select.add(new Option(d.name + (d.isDefault ? '（当前）' : ''), d.id));

    if (match) {
      select.value = match.id;
    } else if (savedId) {
      select.add(new Option((devices ? '（未连接）' : '') + (savedName || savedId), savedId));
      select.value = savedId;
    } else {
      select.value = '';
    }
    select.classList.toggle('missing', !!devices && !match && !!savedId);
  }
}

function choose(slot) {
  const value = selects[slot].value;
  const device = (devices || []).find(d => d.id === value);
  if (device) {
    settings['device' + slot] = device.id;
    settings['device' + slot + 'Name'] = device.name;
  } else if (!value) {
    delete settings['device' + slot];
    delete settings['device' + slot + 'Name'];
  }
  send({ event: 'setSettings', context, payload: settings });
}
</script>
</body>
</html>
